name: Production

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Select version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select next tag
        id: tag
        run: |
          latest=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest="$tag"
              break
            fi
          done < <(git tag --list "v*" --sort=-version:refname)

          if [[ -z "$latest" ]]; then
            next="v0.1.0"
          else
            [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
            next="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1))"
          fi

          echo "tag=$next" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release
        env:
          YOPES_BUILD_VERSION: ${{ needs.prepare.outputs.tag }}
        run: cargo build --release --locked
      - name: Package Unix release
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/yopes-${{ runner.os }}-${{ runner.arch }}.tar.gz" yopes
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path target/release/yopes.exe -DestinationPath "dist/yopes-${{ runner.os }}-${{ runner.arch }}.zip"
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum yopes-* > SHA256SUMS
      - name: Publish GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # What's Changed: one bullet per merged PR, falling back to direct
          # commits, ending with the compare link against the previous tag.
          notes=notes.md
          echo "## What's Changed" > "$notes"

          # The checkout does not fetch tags; pull them for the range below.
          git fetch --tags -q origin

          # The tag being published does not exist yet; exclude it anyway so a
          # re-run of Production cannot compare against itself.
          prev=$(git tag --list 'v*' --sort=-version:refname | grep -v -- "^$TAG$" | head -1 || true)
          seen=0

          if [ -n "$prev" ]; then
            while read -r sha subject; do
              case "$subject" in
                *"pull request #"*" from "*)
                  num="${subject##*#}"; num="${num%% *}"
                  title=$(gh pr view "$num" --json title --jq .title)
                  author=$(gh pr view "$num" --json author --jq .author.login)
                  echo "- $title by @$author in #$num" >> "$notes"
                  seen=1
                  ;;
              esac
            done < <(git log --merges --format='%H %s' "$prev..$GITHUB_SHA")

            while read -r sha subject; do
              echo "- $subject ($(echo "$sha" | cut -c1-7))" >> "$notes"
              seen=1
            done < <(git log --no-merges --format='%H %s' "$prev..$GITHUB_SHA")

            if [ "$seen" = 0 ]; then
              echo "- No changes since $prev" >> "$notes"
            fi

            {
              echo ""
              echo "**Full Changelog:** https://github.com/$REPO/compare/$prev...$TAG"
            } >> "$notes"
          else
            echo "- Initial release" >> "$notes"
          fi

          gh release create "$TAG" dist/* --title "$TAG" --notes-file "$notes" --target "$GITHUB_SHA"
