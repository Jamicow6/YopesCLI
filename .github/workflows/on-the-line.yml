name: On-the-line

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  compile:
    name: Compile test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Compile release
        run: cargo build --release --locked

  publish:
    name: Dispatch Production
    needs: compile
    # Only a main push may release; pull requests compile without touching it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Production
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production.yml --ref main -R "$GITHUB_REPOSITORY"
