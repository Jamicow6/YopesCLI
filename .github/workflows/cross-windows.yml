name: Cross Windows

# Test: compiles the Windows binary on an Ubuntu runner so the release does
# not depend on the Windows hosted pool. Promote into production.yml only if
# the artifact proves out.

on:
  workflow_dispatch:

concurrency:
  group: cross-windows
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Cross-compile Windows from Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: Package
        run: |
          mkdir -p dist
          tar -C target/x86_64-pc-windows-gnu/release -czf "dist/yopes-Windows-X64-cross.tar.gz" yopes.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cross-windows
          path: dist/*
          if-no-files-found: error
