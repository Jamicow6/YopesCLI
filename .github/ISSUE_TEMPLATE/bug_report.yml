name: Bug report
description: Something in yopes does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what yopes did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `yopes`
        2. Type `/connect`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `yopes --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - OpenAI-compatible
        - Ollama
        - Not provider-specific
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste any error text or transcript. Redact API keys.
      render: text
