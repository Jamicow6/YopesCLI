name: Feature request
description: Suggest a capability yopes does not have yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that yopes makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you have in mind, and how you would trigger it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you have tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is a new tool the model can call
        - label: This is a new slash command
        - label: This is a UI change
        - label: This is a provider or backend change
