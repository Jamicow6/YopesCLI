[package]
name = "yopes"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, session-first AI harness for your terminal"
license = "GPL-3.0-only"
repository = "https://github.com/Jamicow6/YopesCLI"
homepage = "https://github.com/Jamicow6/YopesCLI"
readme = "README.md"
keywords = ["cli", "tui", "ai", "agent", "coding-assistant"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/", ".github/"]

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6.0"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "native-tls"] }
semver = "1.0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
textwrap = "0.16"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
